# ============================================================================
# PRODUCTION CONFIGURATION - Optimized for Supabase FREE TIER & Memory Usage
# ============================================================================
# This file contains all required properties for production deployment
# Memory-optimized settings for Render $7/month plan
# ============================================================================

# ===== APPLICATION BASIC CONFIG =====
spring.application.name=event-hub-backend
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ===== STARTUP OPTIMIZATIONS FOR RENDER (Memory Efficient) =====
spring.main.lazy-initialization=true
spring.jmx.enabled=false
spring.main.banner-mode=off
server.servlet.register-default-servlet=false

# ===== DATABASE CONFIGURATION =====
# Production Database (use environment variables)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA/HIBERNATE CONFIGURATION =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.open-in-view=false

# ===== HIKARI CONNECTION POOL - SUPABASE FREE TIER (Memory Optimized) =====
# CRITICAL: Free tier only allows ~15 pooled connections total!
# Memory-optimized: Small pool but with better timeout handling

# Maximum 4 connections - balanced for concurrent requests vs memory usage
# Increased from 3 to handle concurrent requests, but still small for memory
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# Connection timeout - 60 seconds for Supabase network issues
spring.datasource.hikari.connection-timeout=60000

# Release idle connections after 60 seconds (prevents memory buildup)
spring.datasource.hikari.idle-timeout=60000

# Max lifetime 2 minutes - matches Supabase pooler connection recycling
# CRITICAL: Supabase pooler recycles connections, so shorter lifetime prevents validation failures
spring.datasource.hikari.max-lifetime=120000

# Keepalive every 30 seconds to prevent drops
spring.datasource.hikari.keepalive-time=30000

# Validation timeout - 10 seconds for slow networks
spring.datasource.hikari.validation-timeout=10000

# Detect connection leaks (120 seconds - more lenient for slow queries)
spring.datasource.hikari.leak-detection-threshold=120000

# Connection validation
spring.datasource.hikari.connection-test-query=SELECT 1

# Force connection release (memory efficient)
spring.datasource.hikari.auto-commit=true

# Don't fail startup if DB temporarily unavailable (handles Supabase pauses)
spring.datasource.hikari.initialization-fail-timeout=-1

# ===== TRANSACTION POOLER (pgbouncer) SETTINGS =====
# CRITICAL: Disable prepared statements for Transaction pooler!
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=0

# Socket timeouts - increased for Supabase network issues
spring.datasource.hikari.data-source-properties.socketTimeout=90
spring.datasource.hikari.data-source-properties.connectTimeout=60
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# ===== HIBERNATE OPTIMIZATIONS (Memory Efficient) =====
# Batch operations to reduce DB round trips and memory usage
spring.jpa.properties.hibernate.jdbc.batch_size=15
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=25

# ===== JWT CONFIGURATION =====
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh.expiration=604800000

# ===== PAYMENT CONFIGURATION =====
payment.token.percentage=25
payment.gateway.url=https://api.razorpay.com
payment.gateway.key=${RAZORPAY_KEY:rzp_test_mock}
payment.gateway.secret=${RAZORPAY_SECRET:mock_secret}
payment.return.url=${PAYMENT_RETURN_URL:https://cartevent.com/payment/callback}
payment.cancel.url=${PAYMENT_CANCEL_URL:https://cartevent.com/payment/cancel}

# ===== REFUND POLICY CONFIGURATION =====
refund.full.days=30
refund.partial.days=15
refund.partial.percentage=50

# ===== GOOGLE OAUTH CONFIGURATION =====
google.client.id=${GOOGLE_CLIENT_ID}

# ===== EMAIL CONFIGURATION (Brevo SMTP for Production) =====
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===== APP CONFIGURATION =====
app.frontend.url=https://cartevent.com
app.email.from=${EMAIL_FROM:cartevent.welcome@gmail.com}
app.name=EventHub Connect
app.contact-email=${APP_CONTACT_EMAIL:contact@cartevent.com}

# ===== PASSWORD RESET CONFIGURATION =====
password.reset.token.expiry=3600000

# ===== ADMIN CONFIGURATION (Optional - has defaults) =====
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}

