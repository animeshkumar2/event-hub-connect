# Production Configuration - Optimized for Supabase FREE TIER
# Override development settings for production environment

# ===== STARTUP OPTIMIZATIONS FOR RENDER =====
spring.main.lazy-initialization=true
spring.jmx.enabled=false
spring.main.banner-mode=off
server.servlet.register-default-servlet=false

# Email Configuration (Brevo SMTP for Production)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Production Frontend URL
app.frontend.url=https://cartevent.com
app.email.from=cartevent.welcome@gmail.com

# Production Database (use environment variables)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# ===== HIKARI CONNECTION POOL - SUPABASE FREE TIER =====
# CRITICAL: Free tier only allows ~15 pooled connections total!
# Keep pool size VERY small to avoid exhausting Supabase limits

# Maximum 3 connections - leaves room for Supabase dashboard, migrations, etc.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Connection timeout - 30 seconds for Transaction pooler
spring.datasource.hikari.connection-timeout=30000

# Release idle connections quickly (30 seconds)
spring.datasource.hikari.idle-timeout=30000

# Short max lifetime - Transaction pooler may recycle connections
spring.datasource.hikari.max-lifetime=120000

# Keepalive every 30 seconds to prevent drops
spring.datasource.hikari.keepalive-time=30000

# Validation timeout
spring.datasource.hikari.validation-timeout=5000

# Detect connection leaks (60 seconds)
spring.datasource.hikari.leak-detection-threshold=60000

# Connection validation
spring.datasource.hikari.connection-test-query=SELECT 1

# Don't fail startup if DB temporarily unavailable (handles Supabase pauses)
spring.datasource.hikari.initialization-fail-timeout=-1

# ===== TRANSACTION POOLER (pgbouncer) SETTINGS =====
# CRITICAL: Disable prepared statements for Transaction pooler!
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheSizeMiB=0

# Socket timeouts
spring.datasource.hikari.data-source-properties.socketTimeout=45
spring.datasource.hikari.data-source-properties.connectTimeout=30

# ===== HIBERNATE OPTIMIZATIONS =====
# Batch operations to reduce DB round trips
spring.jpa.properties.hibernate.jdbc.batch_size=15
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=25

# Disable open-in-view to release connections faster
spring.jpa.open-in-view=false

# Production JWT Secret
jwt.secret=${JWT_SECRET}

# Production Google OAuth
google.client.id=${GOOGLE_CLIENT_ID}

# Production Logging
logging.level.root=WARN
logging.level.com.eventhub=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=INFO
logging.level.com.zaxxer.hikari.pool.HikariPool=INFO
